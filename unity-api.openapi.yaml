openapi: 3.1.0
info:
  title: SecretWaifu Unity API
  version: 1.2.0
  description: |
    Unity-facing API contract snapshot.
    This schema is the machine-readable source of truth for Unity integration.

servers:
  - url: /api

security:
  - CookieAuth: []
  - BearerAuth: []

paths:
  /auth/me:
    get:
      summary: Get current authenticated user
      operationId: getAuthMe
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/webgl-token:
    get:
      summary: Mint short-lived bearer token from cookie session
      description: Intended for Unity WebGL bridge flow. Desktop/VR clients should use standard bearer-token login/token-issue flow and must not depend on cookie-only authentication.
      operationId: getWebglToken
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebglTokenResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/webgl-launch-context:
    post:
      summary: Mint a short-lived Unity WebGL launch context token
      description: |
        Website-side endpoint. Requires an authenticated cookie or bearer session and a selected
        `character_id`. Returns a short-lived `launch_token` that Unity WebGL can exchange for a
        bearer token via `/auth/webgl-launch-context/resolve`.
      operationId: issueWebglLaunchContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebglLaunchContextIssueRequest'
      responses:
        '200':
          description: Launch context issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebglLaunchContextIssueResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Character is tier-locked for current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/webgl-launch-context/resolve:
    get:
      summary: Exchange Unity WebGL launch token for short-lived bearer token
      description: |
        Unity WebGL calls this endpoint with `launch_token` to receive a bearer token plus launch
        metadata (`character_id`, `open_screen`). Designed to avoid browser-origin CSRF coupling.
      operationId: resolveWebglLaunchContext
      security: []
      parameters:
        - in: query
          name: launch_token
          required: true
          schema:
            type: string
            minLength: 20
            maxLength: 512
      responses:
        '200':
          description: Bearer token issued from launch context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebglLaunchContextResolveResponse'
        '400':
          description: Launch context invalid/expired/consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Account suspended or character tier-locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/unity-token:
    post:
      summary: Issue bearer token for Unity Desktop/VR
      description: |
        Non-browser token issue endpoint for Unity Desktop/VR.
        Accepts JSON email/password and returns a bearer token in the response body.
        This route does not depend on browser cookie auth.
      operationId: postUnityToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnityTokenIssueRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnityTokenIssueResponse'
        '401':
          description: Invalid e-mail or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/logout:
    post:
      summary: Revoke presented session token and clear cookie (if present)
      operationId: postAuthLogout
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [logged_out]
                    properties:
                      logged_out:
                        type: boolean
                        enum: [true]
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /characters:
    get:
      summary: List characters
      description: >
        Public endpoint with optional auth context. `scope=mine` requires authentication.
        Unity playability is driven by approved+published story rows (`story_count`, `default_story_id`).
        For legacy approved characters created before enforcement, run the one-time backend
        `backfill:character-default-stories` script to materialize missing default stories.
      operationId: listCharacters
      security: []
      parameters:
        - $ref: '#/components/parameters/LimitCharacters'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [newest, name, hearts, views]
            default: newest
        - in: query
          name: profile
          required: false
          schema:
            type: string
            enum: [full, unity]
            default: full
        - in: query
          name: scope
          required: false
          description: Unity-friendly roster scope alias (`official` maps to curated/admin-owned rows).
          schema:
            type: string
            enum: [all, official, community, mine]
      responses:
        '200':
          description: Character list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterListResponse'
        '401':
          description: Authentication required for scope=mine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /characters/{character_id}/vrm-signed-url:
    get:
      summary: Request a fresh signed VRM model URL for one character
      operationId: getCharacterVrmSignedUrl
      parameters:
        - in: path
          name: character_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signed URL issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnityModelSignedUrlResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Character/model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /characters/{character_id}/stories:
    get:
      summary: List stories for one character
      description: Public endpoint with optional auth context. Tier-gated characters return `403` when caller lacks required access.
      operationId: listCharacterStories
      security: []
      parameters:
        - in: path
          name: character_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/LimitStandard'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [newest, likes]
            default: newest
      responses:
        '200':
          description: Character story list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterStoriesResponse'
        '403':
          description: Tier-gated access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /stories:
    get:
      summary: Global/public story discovery list
      operationId: listGlobalStories
      security: []
      parameters:
        - $ref: '#/components/parameters/LimitStandard'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [newest, likes]
            default: newest
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [all, mine]
            default: all
        - in: query
          name: publication
          required: false
          schema:
            type: string
            enum: [all, draft, published, rejected]
            default: all
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: character_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Story discovery list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStoryListResponse'
        '401':
          description: Authentication required for scope=mine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /stories/{story_id}/sessions:
    get:
      summary: List sessions for one story
      operationId: listStorySessions
      parameters:
        - in: path
          name: story_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/LimitSessions'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '400':
          description: Story is not chat-usable in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /sessions:
    post:
      summary: Create chat session for story
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [story_id]
              additionalProperties: false
              properties:
                story_id:
                  type: string
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Story is not chat-usable in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: List sessions by story_id
      operationId: listSessionsByStory
      parameters:
        - in: query
          name: story_id
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/LimitSessions'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /sessions/{session_id}/messages:
    get:
      summary: List one session transcript with cursor pagination
      description: Returns persisted chat message rows for the owned session. Incomplete turns that were never persisted are not included. Soft-deleted sessions return `404`.
      operationId: listSessionMessages
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Session message list (persisted rows only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMessageListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /sessions/{session_id}:
    delete:
      summary: Soft-delete one owned chat session
      description: Marks the session as deleted and hides it from session lists/read/send routes.
      operationId: deleteSession
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDeleteResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /sessions/{session_id}/unity-state:
    get:
      summary: Get Unity-owned session metadata blob
      description: Returns Unity gameplay/session metadata scoped to this session and owned by the caller.
      operationId: getSessionUnityState
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unity session metadata payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUnityStateResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Upsert Unity-owned session metadata blob
      description: Stores Unity gameplay/session metadata as opaque JSON. Backend does not interpret gameplay fields.
      operationId: putSessionUnityState
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata_version, metadata]
              properties:
                metadata_version:
                  type: integer
                  minimum: 1
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Stored Unity session metadata payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUnityStateResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/send:
    post:
      summary: Send one chat turn with atomic quota + idempotency
      description: |
        Voice behavior:
        - Unity only sends `voice_enabled=true|false` (no explicit voice id field required).
        - When `voice_enabled=true`, backend resolves `voice_ref_path` from session character:
          1) use configured character voice URL when present
          2) otherwise fallback to `"default"` voice alias.
      operationId: sendChatMessage
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 128
            pattern: '^[a-zA-Z0-9._:-]+$'
          description: Optional header alias for client_message_id. If both are provided, values must match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, message]
              properties:
                session_id:
                  type: string
                message:
                  type: string
                  minLength: 1
                  maxLength: 8000
                unity_system_context:
                  type: string
                  minLength: 1
                  maxLength: 20000
                  description: >
                    Unity-owned hidden system/context prompt text used for assistant generation.
                    Not persisted as a transcript message.
                voice_enabled:
                  type: boolean
                  default: false
                  description: Enables backend voice generation with server-side voice resolution (character voice or `default` fallback).
                stream:
                  type: boolean
                  default: false
                client_message_id:
                  type: string
                  pattern: '^[a-zA-Z0-9._:-]+$'
                  maxLength: 128
      responses:
        '200':
          description: Completed send result (fresh or replayed) or quota-exhausted data
          headers:
            Idempotency-Replayed:
              description: Present and true when backend replays an already-completed idempotent request.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatSendSuccessResponse'
                  - $ref: '#/components/schemas/QuotaDataResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatSseEvent'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: User id does not match authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency key is currently in progress
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Idempotency key was reused with different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: AI provider failure with released reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/gameplay-send:
    post:
      summary: Persist gameplay/system event + assistant reply without consuming message or voice quota
      description: |
        Non-quota gameplay/system generation endpoint.
        Calls to this endpoint do not consume message quota or voice quota units.
        When `voice_enabled=true`, backend applies the same server-side voice resolution as `/chat/send`:
        character voice when configured, otherwise `"default"` fallback.
      operationId: sendGameplayChatMessage
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 128
            pattern: '^[a-zA-Z0-9._:-]+$'
          description: Optional header alias for client_event_id. If both are provided, values must match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, event_type, event_payload, event_display_text, unity_system_context]
              properties:
                session_id:
                  type: string
                event_type:
                  type: string
                  enum: [touch, undress, post_sex_return, sex_rejected, sex_postponed]
                event_payload:
                  type: object
                  additionalProperties: true
                event_display_text:
                  type: string
                  minLength: 1
                  maxLength: 8000
                unity_system_context:
                  type: string
                  minLength: 1
                  maxLength: 20000
                voice_enabled:
                  type: boolean
                  default: false
                  description: Enables backend voice generation with server-side voice resolution (character voice or `default` fallback).
                stream:
                  type: boolean
                  default: false
                client_event_id:
                  type: string
                  pattern: '^[a-zA-Z0-9._:-]+$'
                  maxLength: 128
      responses:
        '200':
          description: Completed gameplay send result (fresh or replayed)
          headers:
            Idempotency-Replayed:
              description: Present and true when backend replays an already-completed idempotent request.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameplaySendSuccessResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatSseEvent'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency key is currently in progress
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Idempotency key was reused with different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: AI provider failure or finalize failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /tts/request:
    post:
      summary: Queue one Unity-driven TTS segment and return voice_task_id
      description: |
        Unity calls this per sentence/chunk for playback orchestration.
        This endpoint does not consume message quota; it only creates a voice task linked to an existing session/message context.
      operationId: requestTtsTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequestBody'
      responses:
        '202':
          description: TTS task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TtsRequestResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session/message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: TTS webhook not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /tts/stream/{voice_task_id}:
    get:
      summary: WebSocket upgrade endpoint for streaming voice PCM frames by task id
      description: |
        Unity opens this socket after receiving `voice_task_id` from `/api/chat/send` or `/api/chat/gameplay-send`.
        Authentication can be provided via bearer header or query token.
        Stream frame contract:
        - text frame: `{"type":"metadata","task_id":"...","sample_rate":24000,"channels":1,"estimated_samples":...}` (initial control frame)
        - binary frame: raw PCM bytes
        - text frame: `{"type":"complete"}` stream finished
        - text frame: `{"type":"error","message":"..."}` stream failed
        - text frame: `{"type":"cancelled"}` stream cancelled
        PCM format: Float32, mono, 24000 Hz, little-endian.
      operationId: streamVoiceTask
      parameters:
        - in: path
          name: voice_task_id
          required: true
          schema:
            type: string
        - in: query
          name: token
          required: false
          schema:
            type: string
          description: Optional bearer token alias for WebSocket clients that cannot set Authorization headers.
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '401':
          description: Authentication required
        '403':
          description: Voice task not owned by authenticated user
        '500':
          description: Stream unavailable

  /chat/quota/check:
    post:
      summary: Advisory quota precheck (no consume, no reserve)
      operationId: checkQuota
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userId:
                  type: string
                user_id:
                  type: string
                voice_enabled:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Quota data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaDataResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/quota/consume:
    post:
      summary: Legacy alias of /chat/quota/check (same advisory semantics)
      operationId: precheckQuotaLegacy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userId:
                  type: string
                user_id:
                  type: string
                voice_enabled:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Quota data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaDataResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/quota/status:
    get:
      summary: Get current quota status
      operationId: getQuotaStatus
      parameters:
        - in: query
          name: userId
          required: false
          schema:
            type: string
        - in: query
          name: user_id
          required: false
          schema:
            type: string
        - in: query
          name: voice_enabled
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Quota data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaDataResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: secretwaifu_auth
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Opaque pagination cursor.

    LimitCharacters:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 24

    LimitStandard:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    LimitSessions:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30

  schemas:
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - BAD_REQUEST
        - VALIDATION_FAILED
        - QUOTA_EXHAUSTED
        - QUOTA_EXCEEDED
        - AI_PROVIDER_FAILURE
        - RATE_LIMITED
        - SESSION_INVALID
        - DUPLICATE_REQUEST
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - DEFAULT_STORY_REQUIRED
        - INTERNAL_ERROR

    StoryScenarioType:
      type: string
      enum: [CYBERPUNK, ROMANCE, FANTASY, SLICE_OF_LIFE, HORROR, ACTION, COMEDY, OTHER]

    ChatMessageRole:
      type: string
      enum: [USER, ASSISTANT, GAMEPLAY]

    StoryPublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED]

    StoryModerationStatus:
      type: string
      enum: [NONE, PENDING, APPROVED, REJECTED]

    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type:
            - string
            - 'null'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'

    ErrorEnvelope:
      type: object
      description: Compatibility envelope. Top-level code/message/details mirror error.code/message/details.
      required: [error, code, message]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'

    AuthMeTier:
      type: object
      required: [code, message_limit, period_days, label]
      properties:
        code:
          type: string
        message_limit:
          type: integer
        period_days:
          type: integer
        label:
          type:
            - string
            - 'null'

    AuthMeUser:
      type: object
      required:
        - id
        - email
        - username
        - player_name
        - role
        - is_email_verified
        - avatar_url
        - created_at
        - updated_at
        - tier_code
        - tier
        - unread_notification_count
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        player_name:
          type: string
          description: In-game display name editable from profile (falls back to username when unset).
        role:
          type: string
          enum: [USER, ADMIN]
        is_email_verified:
          type: boolean
        avatar_url:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tier_code:
          type:
            - string
            - 'null'
          description: Canonical product tier code (`free`, `basic`, `premium`). Legacy aliases may appear only during migration windows.
        effective_tier_code:
          type: string
          enum: [free, basic, premium, admin]
          description: Effective access tier resolved from active entitlements/Patreon (and `admin` for admin users). Use this for access gating checks.
        effective_tier_cents:
          type:
            - integer
            - 'null'
          description: Effective Patreon-equivalent tier amount used by access logic (null for admin users).
        tier:
          oneOf:
            - $ref: '#/components/schemas/AuthMeTier'
            - type: 'null'
        unread_notification_count:
          type: integer

    AuthMeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AuthMeUser'

    WebglTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, expires_at, token_type]
          properties:
            token:
              type: string
            expires_at:
              type: string
              format: date-time
            token_type:
              type: string
              enum: [Bearer]

    UnityTokenIssueRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      additionalProperties: false

    UnityTokenIssueUser:
      type: object
      required: [id, email, username, player_name, role, is_email_verified]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        player_name:
          type: string
          description: In-game display name editable from profile (falls back to username when unset).
        role:
          type: string
          enum: [USER, ADMIN]
        is_email_verified:
          type: boolean

    UnityTokenIssueResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, token_type, expires_at, user]
          properties:
            access_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/UnityTokenIssueUser'

    WebglLaunchContextIssueRequest:
      type: object
      required: [character_id]
      properties:
        character_id:
          type: string
        single_use:
          type: boolean
          default: true
      additionalProperties: false

    WebglLaunchContextIssueResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [launch_token, character_id, expires_at, single_use]
          properties:
            launch_token:
              type: string
            character_id:
              type: string
            expires_at:
              type: string
              format: date-time
            single_use:
              type: boolean

    WebglLaunchContextResolveResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, token_type, expires_at, player_name, launch]
          properties:
            access_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_at:
              type: string
              format: date-time
            player_name:
              type: string
              description: In-game display name editable from profile (falls back to username when unset).
            launch:
              type: object
              required: [character_id, open_screen]
              properties:
                character_id:
                  type: string
                open_screen:
                  type: string
                  enum: [story_select]

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    CharacterUnityAsset:
      type: object
      required: [asset_key, model_url, model_hash, model_version, icon_url, signed_model_url_endpoint]
      properties:
        asset_key:
          type: string
        model_url:
          type:
            - string
            - 'null'
        model_hash:
          type:
            - string
            - 'null'
        model_version:
          type: string
          format: date-time
        icon_url:
          type:
            - string
            - 'null'
        voice_file_url:
          type:
            - string
            - 'null'
          description: Optional selected/static character voice clip URL for Unity. Backend uses this as preferred voice source when `voice_enabled=true`; falls back to `"default"` when null.
        voice_file_name:
          type:
            - string
            - 'null'
          description: Optional selected/static character voice clip display filename.
        signed_model_url_endpoint:
          type: string
          format: uri

    CharacterUnity:
      type: object
      required:
        [
          id,
          slug,
          name,
          preview_image_url,
          thumbnail_url,
          tier_code,
          story_count,
          default_story_id,
          source_type,
          is_mine,
          uploader_display_name,
          access_state,
          unity_asset
        ]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        preview_image_url:
          type:
            - string
            - 'null'
        thumbnail_url:
          type:
            - string
            - 'null'
        tier_code:
          type: string
          description: Canonical product tier code (`free`, `basic`, `premium`) for Unity-facing responses.
        story_count:
          type: integer
          description: Number of approved+published playable stories visible to Unity for this character.
        default_story_id:
          type:
            - string
            - 'null'
          description: Default playable story id. Null means backend has no approved+published default story row yet.
        source_type:
          type: string
          enum: [official, community]
        is_mine:
          type: boolean
        uploader_display_name:
          type: string
        access_state:
          type: string
          enum: [accessible, tier_locked, unavailable]
          description: >
            Runtime access state for Unity. Characters without an approved published
            default story are returned as `unavailable`.
        unity_asset:
          $ref: '#/components/schemas/CharacterUnityAsset'

    CharacterListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/CharacterUnity'
            - type: array
              items:
                type: object
                additionalProperties: true
                description: Full profile rows include extra website/admin fields.
        page:
          $ref: '#/components/schemas/PageInfo'

    CharacterRef:
      type: object
      required: [id, slug, name, default_story_id]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        default_story_id:
          type:
            - string
            - 'null'

    StoryAuthorRef:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string

    StoryListItem:
      type: object
      description: |
        Story read DTO for Unity story selection.
        New story authoring requires `prompt_description`, `personality`, `scenario`, and `first_message`.
        `scenario_type` remains nullable/legacy and is not required for publish flow.
      required:
        - id
        - title
        - prompt_description
        - personality
        - scenario
        - first_message
        - scenario_type
        - published_at
        - likes_count
        - has_liked
        - is_curated
        - author
      properties:
        id:
          type: string
        title:
          type: string
        prompt_description:
          type:
            - string
            - 'null'
        personality:
          type:
            - string
            - 'null'
        scenario:
          type:
            - string
            - 'null'
        first_message:
          type:
            - string
            - 'null'
        scenario_type:
          oneOf:
            - $ref: '#/components/schemas/StoryScenarioType'
            - type: 'null'
        published_at:
          type:
            - string
            - 'null'
          format: date-time
        likes_count:
          type: integer
        has_liked:
          type: boolean
        is_curated:
          type: boolean
        author:
          $ref: '#/components/schemas/StoryAuthorRef'

    CharacterStoriesData:
      type: object
      required: [character, stories]
      properties:
        character:
          $ref: '#/components/schemas/CharacterRef'
        stories:
          type: array
          items:
            $ref: '#/components/schemas/StoryListItem'

    CharacterStoriesResponse:
      type: object
      required: [data, page]
      properties:
        data:
          $ref: '#/components/schemas/CharacterStoriesData'
        page:
          $ref: '#/components/schemas/PageInfo'

    GlobalStoryListItem:
      type: object
      description: Shared discovery-feed DTO. CamelCase fields are intentional for website compatibility.
      additionalProperties: false
      required:
        - id
        - title
        - promptDescription
        - personality
        - scenario
        - firstMessage
        - exampleDialogs
        - scenarioStory
        - scenarioChat
        - publicationStatus
        - moderationStatus
        - publishedAt
        - likesCount
        - scenarioType
        - createdAt
        - updatedAt
        - author
        - character
        - bodyPreview
        - public_summary
        - is_public
        - hasLiked
      properties:
        id:
          type: string
        title:
          type: string
        promptDescription:
          type:
            - string
            - 'null'
        personality:
          type:
            - string
            - 'null'
        scenario:
          type:
            - string
            - 'null'
        firstMessage:
          type:
            - string
            - 'null'
        exampleDialogs:
          type:
            - string
            - 'null'
        scenarioStory:
          type: string
        scenarioChat:
          type: string
        publicationStatus:
          $ref: '#/components/schemas/StoryPublicationStatus'
        moderationStatus:
          $ref: '#/components/schemas/StoryModerationStatus'
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        likesCount:
          type: integer
        scenarioType:
          oneOf:
            - $ref: '#/components/schemas/StoryScenarioType'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          type: object
          required: [id, username]
          properties:
            id:
              type: string
            username:
              type: string
        character:
          type: object
          required: [id, name, slug, previewImageUrl]
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
            previewImageUrl:
              type:
                - string
                - 'null'
        bodyPreview:
          type: string
        public_summary:
          type: string
        is_public:
          type: boolean
        hasLiked:
          type: boolean

    GlobalStoryListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GlobalStoryListItem'
        page:
          $ref: '#/components/schemas/PageInfo'

    SessionItem:
      type: object
      required: [id, user_id, story_id, character_card_id, created_at, last_updated, preview_text]
      properties:
        id:
          type: string
        user_id:
          type: string
        story_id:
          type: string
        character_card_id:
          type: string
        created_at:
          type: string
          format: date-time
        last_updated:
          type: string
          format: date-time
        preview_text:
          type:
            - string
            - 'null'

    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionItem'

    SessionDeleteData:
      type: object
      required: [id, deleted, deleted_at]
      properties:
        id:
          type: string
        deleted:
          type: boolean
          enum: [true]
        deleted_at:
          type: string
          format: date-time

    SessionDeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionDeleteData'

    SessionUnityStateData:
      type: object
      required: [session_id, metadata_version, metadata]
      properties:
        session_id:
          type: string
        metadata_version:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true

    SessionUnityStateResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionUnityStateData'

    SessionListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionItem'
        page:
          $ref: '#/components/schemas/PageInfo'

    SessionMessageKind:
      type: string
      enum: [user_text, assistant_text, gameplay_event, gameplay_assistant]

    SessionMessageItem:
      type: object
      required: [id, session_id, role, message_kind, content, client_message_id, client_event_id, audio_url, created_at]
      properties:
        id:
          type: string
        session_id:
          type: string
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        message_kind:
          $ref: '#/components/schemas/SessionMessageKind'
        content:
          type: string
        client_message_id:
          type:
            - string
            - 'null'
        client_event_id:
          type:
            - string
            - 'null'
        audio_url:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time

    SessionMessageListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionMessageItem'
        page:
          $ref: '#/components/schemas/PageInfo'

    UserMessageItem:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
        created_at:
          type: string
          format: date-time

    AssistantMessageItem:
      type: object
      required: [id, role, content, created_at, audio_url]
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
        created_at:
          type: string
          format: date-time
        audio_url:
          type:
            - string
            - 'null'

    QuotaExhaustionReason:
      oneOf:
