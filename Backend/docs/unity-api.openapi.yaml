openapi: 3.1.0
info:
  title: SecretWaifu Unity API
  version: 1.1.0
  description: |
    Unity-facing API contract snapshot.
    This schema is the machine-readable source of truth for Unity integration.

servers:
  - url: /api

security:
  - CookieAuth: []
  - BearerAuth: []

paths:
  /auth/me:
    get:
      summary: Get current authenticated user
      operationId: getAuthMe
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/webgl-token:
    get:
      summary: Mint short-lived bearer token from cookie session
      description: Intended for Unity WebGL bridge flow. Desktop/VR clients should use standard bearer-token login/token-issue flow and must not depend on cookie-only authentication.
      operationId: getWebglToken
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebglTokenResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/logout:
    post:
      summary: Revoke presented session token and clear cookie (if present)
      operationId: postAuthLogout
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [logged_out]
                    properties:
                      logged_out:
                        type: boolean
                        enum: [true]
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /characters:
    get:
      summary: List characters
      operationId: listCharacters
      security: []
      parameters:
        - $ref: '#/components/parameters/LimitCharacters'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [newest, name, hearts, views]
            default: newest
        - in: query
          name: profile
          required: false
          schema:
            type: string
            enum: [full, unity]
            default: full
      responses:
        '200':
          description: Character list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterListResponse'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /characters/{character_id}/stories:
    get:
      summary: List stories for one character
      operationId: listCharacterStories
      security: []
      parameters:
        - in: path
          name: character_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/LimitStandard'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [newest, likes]
            default: newest
      responses:
        '200':
          description: Character story list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterStoriesResponse'
        '403':
          description: Tier-gated access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /stories:
    get:
      summary: Global/public story discovery list
      operationId: listGlobalStories
      security: []
      parameters:
        - $ref: '#/components/parameters/LimitStandard'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [newest, likes]
            default: newest
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [all, mine]
            default: all
        - in: query
          name: publication
          required: false
          schema:
            type: string
            enum: [all, draft, published, rejected]
            default: all
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: character_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Story discovery list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStoryListResponse'
        '401':
          description: Authentication required for scope=mine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /stories/{story_id}/sessions:
    get:
      summary: List sessions for one story
      operationId: listStorySessions
      parameters:
        - in: path
          name: story_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/LimitSessions'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '400':
          description: Story is not chat-usable in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /sessions:
    post:
      summary: Create chat session for story
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [story_id]
              additionalProperties: false
              properties:
                story_id:
                  type: string
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Story is not chat-usable in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: List sessions by story_id
      operationId: listSessionsByStory
      parameters:
        - in: query
          name: story_id
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/LimitSessions'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /sessions/{session_id}/messages:
    get:
      summary: List one session transcript with cursor pagination
      description: Returns persisted chat message rows for the owned session. Incomplete turns that were never persisted are not included. No additional deleted/moderated filtering is currently applied.
      operationId: listSessionMessages
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Session message list (persisted rows only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMessageListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/send:
    post:
      summary: Send one chat turn with atomic quota + idempotency
      operationId: sendChatMessage
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 128
            pattern: '^[a-zA-Z0-9._:-]+$'
          description: Optional header alias for client_message_id. If both are provided, values must match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, message, client_message_id]
              properties:
                session_id:
                  type: string
                message:
                  type: string
                  minLength: 1
                  maxLength: 8000
                client_message_id:
                  type: string
                  pattern: '^[a-zA-Z0-9._:-]+$'
                  maxLength: 128
      responses:
        '200':
          description: Completed send result (fresh or replayed) or quota-exhausted data
          headers:
            Idempotency-Replayed:
              description: Present and true when backend replays an already-completed idempotent request.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatSendSuccessResponse'
                  - $ref: '#/components/schemas/QuotaDataResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: User id does not match authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency key is currently in progress
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Idempotency key was reused with different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: AI provider failure with released reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/quota/check:
    post:
      summary: Advisory quota precheck (no consume, no reserve)
      operationId: checkQuota
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userId:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: Quota data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaDataResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/quota/consume:
    post:
      summary: Legacy alias of /chat/quota/check (same advisory semantics)
      operationId: precheckQuotaLegacy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userId:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: Quota data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaDataResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /chat/quota/status:
    get:
      summary: Get current quota status
      operationId: getQuotaStatus
      responses:
        '200':
          description: Quota data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaDataResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: secretwaifu_auth
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Opaque pagination cursor.

    LimitCharacters:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 24

    LimitStandard:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    LimitSessions:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30

  schemas:
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - BAD_REQUEST
        - VALIDATION_FAILED
        - QUOTA_EXHAUSTED
        - QUOTA_EXCEEDED
        - AI_PROVIDER_FAILURE
        - RATE_LIMITED
        - SESSION_INVALID
        - DUPLICATE_REQUEST
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - INTERNAL_ERROR

    StoryScenarioType:
      type: string
      enum: [CYBERPUNK, ROMANCE, FANTASY, SLICE_OF_LIFE, HORROR, ACTION, COMEDY, OTHER]

    ChatMessageRole:
      type: string
      enum: [USER, ASSISTANT]

    StoryPublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED]

    StoryModerationStatus:
      type: string
      enum: [NONE, PENDING, APPROVED, REJECTED]

    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type:
            - string
            - 'null'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'

    ErrorEnvelope:
      type: object
      description: Compatibility envelope. Top-level code/message/details mirror error.code/message/details.
      required: [error, code, message]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'

    AuthMeTier:
      type: object
      required: [code, message_limit, period_days, label]
      properties:
        code:
          type: string
        message_limit:
          type: integer
        period_days:
          type: integer
        label:
          type:
            - string
            - 'null'

    AuthMeUser:
      type: object
      required:
        - id
        - email
        - username
        - role
        - is_email_verified
        - avatar_url
        - created_at
        - updated_at
        - tier_code
        - tier
        - unread_notification_count
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        is_email_verified:
          type: boolean
        avatar_url:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tier_code:
          type:
            - string
            - 'null'
        tier:
          oneOf:
            - $ref: '#/components/schemas/AuthMeTier'
            - type: 'null'
        unread_notification_count:
          type: integer

    AuthMeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AuthMeUser'

    WebglTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, expires_at, token_type]
          properties:
            token:
              type: string
            expires_at:
              type: string
              format: date-time
            token_type:
              type: string
              enum: [Bearer]

    CharacterUnityAsset:
      type: object
      required: [asset_key, model_url, model_hash, model_version, icon_url, signed_model_url_endpoint]
      properties:
        asset_key:
          type: string
        model_url:
          type:
            - string
            - 'null'
        model_hash:
          type:
            - string
            - 'null'
        model_version:
          type: string
          format: date-time
        icon_url:
          type:
            - string
            - 'null'
        signed_model_url_endpoint:
          type: string
          format: uri

    CharacterUnity:
      type: object
      required: [id, slug, name, preview_image_url, thumbnail_url, tier_code, story_count, default_story_id, unity_asset]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        preview_image_url:
          type:
            - string
            - 'null'
        thumbnail_url:
          type:
            - string
            - 'null'
        tier_code:
          type: string
        story_count:
          type: integer
        default_story_id:
          type:
            - string
            - 'null'
        unity_asset:
          $ref: '#/components/schemas/CharacterUnityAsset'

    CharacterListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/CharacterUnity'
            - type: array
              items:
                type: object
                additionalProperties: true
                description: Full profile rows include extra website/admin fields.
        page:
          $ref: '#/components/schemas/PageInfo'

    CharacterRef:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string

    StoryListItem:
      type: object
      required:
        - id
        - title
        - prompt_description
        - personality
        - scenario
        - first_message
        - scenario_type
        - published_at
        - likes_count
        - has_liked
      properties:
        id:
          type: string
        title:
          type: string
        prompt_description:
          type:
            - string
            - 'null'
        personality:
          type:
            - string
            - 'null'
        scenario:
          type:
            - string
            - 'null'
        first_message:
          type:
            - string
            - 'null'
        scenario_type:
          oneOf:
            - $ref: '#/components/schemas/StoryScenarioType'
            - type: 'null'
        published_at:
          type:
            - string
            - 'null'
          format: date-time
        likes_count:
          type: integer
        has_liked:
          type: boolean

    CharacterStoriesData:
      type: object
      required: [character, stories]
      properties:
        character:
          $ref: '#/components/schemas/CharacterRef'
        stories:
          type: array
          items:
            $ref: '#/components/schemas/StoryListItem'

    CharacterStoriesResponse:
      type: object
      required: [data, page]
      properties:
        data:
          $ref: '#/components/schemas/CharacterStoriesData'
        page:
          $ref: '#/components/schemas/PageInfo'

    GlobalStoryListItem:
      type: object
      description: Shared discovery-feed DTO. CamelCase fields are intentional for website compatibility.
      additionalProperties: false
      required:
        - id
        - title
        - promptDescription
        - personality
        - scenario
        - firstMessage
        - exampleDialogs
        - scenarioStory
        - scenarioChat
        - publicationStatus
        - moderationStatus
        - publishedAt
        - likesCount
        - scenarioType
        - createdAt
        - updatedAt
        - author
        - character
        - bodyPreview
        - public_summary
        - is_public
        - hasLiked
      properties:
        id:
          type: string
        title:
          type: string
        promptDescription:
          type:
            - string
            - 'null'
        personality:
          type:
            - string
            - 'null'
        scenario:
          type:
            - string
            - 'null'
        firstMessage:
          type:
            - string
            - 'null'
        exampleDialogs:
          type:
